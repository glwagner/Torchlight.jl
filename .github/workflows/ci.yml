name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  julia:
    name: Julia ${{ matrix.julia-version }} tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          # Reactant/XLA on CI runners is slow; the full three-backend run is
          # exercised locally via benchmarks/run_all.sh and reported in docs.
          TORCHLIGHT_TEST_BACKENDS: zygote,enzyme
  python:
    name: Python reference and JAX adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install -r python/requirements.txt
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - name: Regenerate tiny fixtures and check they read back
        run: |
          cd python && python -m torchlight_ref.dump_column_mlp --out ../data/fixtures --sizes tiny
